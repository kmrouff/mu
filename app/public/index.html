<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* mu is a fixed-size app shell, not a scrollable document — this stops mobile
         Safari/Chrome's rubber-band bounce from dragging the whole page and revealing
         a sliver of background past its edge when someone swipes on empty space. */
      html,
      body {
        overscroll-behavior: none;
      }
      /* Without this, pressing and holding the orb or a contact's name (an ordinary press
         gesture in this app) gets interpreted by the browser as a text-selection drag or,
         on iOS Safari, the long-press "callout" menu (Copy / Look Up) — the two visibly
         fight with the app's own press animation and read as wild flickering, and can
         leave a name stuck highlighted after release. mu is meant to feel like an app,
         not a page of selectable text, so turn this off everywhere except real inputs. */
      #root * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #root input,
      #root textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      /* Removes the grey/blue tap-highlight flash mobile browsers draw on every tap. */
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
